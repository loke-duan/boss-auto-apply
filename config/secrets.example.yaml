# secrets.example.yaml — 敏感信息占位模板
# 用法：cp config/secrets.example.yaml config/secrets.yaml 后填真值
# 注意：secrets.yaml 已在 .gitignore，绝不进版本库

# BOSS 账号 cookie 路径（M3 才用到 DrissionPage 时）
boss:
  cookie_profile: "~/.boss-auto-apply/chrome-profile"
  # 真实 cookie/账号信息不写这里，走 boss login 持久化

# LLM：本项目全走 zcode agent，不需要 API key（凭证在 ~/.zcode/cli/config.json）
llm: {}
